# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# HTTP proxy (Clash on 127.0.0.1:7890) — needed to reach maven.neoforged.net / Minecraft libs.
# CN mirrors stay direct (nonProxyHosts).
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=127.0.0.1|localhost|maven.aliyun.com|mirrors.cloud.tencent.com|mirrors.aliyun.com
systemProp.https.nonProxyHosts=127.0.0.1|localhost|maven.aliyun.com|mirrors.cloud.tencent.com|mirrors.aliyun.com

# Generous timeouts for slow proxied downloads (NeoForge/MC artifacts).
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# NeoForge / Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.233
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod Properties
mod_id=whereisit
mod_name=Where Is It
mod_license=LGPL-3.0-only
mod_version=2.6.4-neoforge-client
mod_group_id=red.jackf
mod_authors=JackFred (original), NeoForge port
mod_description=Find items in nearby inventories. Pure-client NeoForge port that records opened containers.

# Dependencies
yacl_version=3.6.5+1.21.1-neoforge
